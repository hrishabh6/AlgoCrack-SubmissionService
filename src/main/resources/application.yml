server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: AlgoCrack-SubmissionService
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      initialization-fail-timeout: ${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT:0}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    connect-retries: ${SPRING_FLYWAY_CONNECT_RETRIES:10}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: when_authorized

gamification:
  badge:
    graph-tag-name: Graph
  progress:
    outbox-batch-size: 25
    outbox-poll-ms: 5000
  rank:
    mastery-easy: 10
    mastery-medium: 25
    mastery-hard: 45
    potd-easy: 6
    potd-medium: 8
    potd-hard: 10
    breadth-cap: 300

playground:
  api-enabled: ${PLAYGROUND_API_ENABLED:false}
  run-enabled: ${PLAYGROUND_RUN_ENABLED:false}
  guard-cleanup-ms: ${PLAYGROUND_GUARD_CLEANUP_MS:300000}

complexity:
  api-enabled: ${COMPLEXITY_API_ENABLED:false}
  static-analysis-enabled: ${COMPLEXITY_STATIC_ANALYSIS_ENABLED:false}
  dynamic-profiling-enabled: ${COMPLEXITY_DYNAMIC_PROFILING_ENABLED:false}
  max-page-size: ${COMPLEXITY_MAX_PAGE_SIZE:20}
  poll-after-ms: ${COMPLEXITY_POLL_AFTER_MS:1000}
  worker-poll-ms: ${COMPLEXITY_WORKER_POLL_MS:2000}
  worker-lease-seconds: ${COMPLEXITY_WORKER_LEASE_SECONDS:45}
  cxe-profile-poll-max-attempts: ${COMPLEXITY_CXE_PROFILE_POLL_MAX_ATTEMPTS:240}
  cxe-profile-poll-interval-ms: ${COMPLEXITY_CXE_PROFILE_POLL_INTERVAL_MS:500}
  measurement:
    min-usable-size-points: ${COMPLEXITY_MIN_USABLE_SIZE_POINTS:4}
    min-useful-duration-ns: ${COMPLEXITY_MIN_USEFUL_DURATION_NS:50000}
    max-relative-mad: ${COMPLEXITY_MAX_RELATIVE_MAD:0.35}
    max-normalized-spread: ${COMPLEXITY_MAX_NORMALIZED_SPREAD:0.45}
    min-winner-margin: ${COMPLEXITY_MIN_WINNER_MARGIN:0.15}

# Code Execution Service Configuration
cxe:
  service:
    url: ${CXE_SERVICE_URL:http://code-execution-engine:8081}
    timeout-seconds: 30

# Async Processing Configuration
async:
  core-pool-size: 5
  max-pool-size: 20
  queue-capacity: 100

# Logging
logging:
  level:
    com.hrishabh.algocracksubmissionservice: INFO

# Inter-service communication
services:
  problem:
    base-url: ${PROBLEM_SERVICE_URL:http://problem-service:8084}
    internal-service-token: ${INTERNAL_SERVICE_TOKEN:}
